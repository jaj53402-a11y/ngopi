<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Play List Video</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 380px;
      background: #fff;
      padding: 22px;
      border-radius: 14px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
      text-align: center;
    }

    h1 {
      font-size: 20px;
      color: #111;
      margin-bottom: 18px;
      font-weight: 700;
    }

    .btn-watch {
      display: block;
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg,#000,#24292e);
      color: #fff;
      text-decoration: none;
      font-size: 16px;
      border-radius: 8px;
      margin: 12px 0;
      font-weight: bold;
      transition: 0.25s ease;
    }

    .btn-watch:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(0,0,0,0.25);
    }

    .gif-btn img {
      width: 100%;
      border-radius: 10px;
      margin-top: 14px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Watch Full Video</h1>

  <!-- TOMBOL VIDEO -->
  <a href="https://jisamsoe565-newbos.github.io/ngopi/?v=jX3FoUQK1.mp4" class="btn-watch">
    ▶ Watch Now
  </a>

  <!-- IKLAN GIF -->
  <a href="https://portslocked.com/exmzc503?key=372fb69fec1df494b0767c2d2f97f088" class="gif-btn">
    <img src="https://cdn.storageimagedisplay.com/349/34c/ec9/320x50_2_iam18.gif" alt="Advertisement">
  </a>

</div>

</body>
</html>
